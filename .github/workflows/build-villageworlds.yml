name: Build Village Worlds
on:
  push:
    branches: [villageworlds-build-20260723]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Extract official 1.21.11 worldgen schemas
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar' -o minecraft-server.jar
          mkdir -p vanilla-outer vanilla-data
          unzip -q minecraft-server.jar -d vanilla-outer
          nested="$(find vanilla-outer -type f -name 'server-*.jar' | head -n 1)"
          test -n "$nested"
          unzip -q "$nested" \
            'data/minecraft/worldgen/structure/*.json' \
            'data/minecraft/worldgen/structure_set/*.json' \
            'data/minecraft/worldgen/template_pool/*.json' \
            'data/minecraft/worldgen/processor_list/*.json' \
            'data/minecraft/tags/worldgen/biome/has_structure/*.json' \
            'data/minecraft/loot_table/chests/*.json' \
            'data/minecraft/structure/*.nbt' \
            -d vanilla-data || true
      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          gradle clean check build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: villageworlds-build-output
          path: |
            build.log
            build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.21.11-worldgen-reference
          path: vanilla-data/
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
