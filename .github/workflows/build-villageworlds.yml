name: Build Village Worlds
on:
  push:
    branches: [villageworlds-build-20260723]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          gradle clean check build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: villageworlds-build-output
          path: |
            build.log
            build/libs/*.jar
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
